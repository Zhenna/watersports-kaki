name: Tide page check

# Every Monday at 09:00 Singapore time. A failed run emails you through GitHub's usual notifications.
# GitHub pauses scheduled workflows on a public repo after 60 days with no repository activity.
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_tide_page.py
