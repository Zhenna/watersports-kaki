<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0D2C5B">
<title>Check conditions | WaterSports Kaki</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <img src="logo-emblem.png" alt="">
  <div class="brand">WaterSports Kaki</div>
</header>
<main>
  <h1>Check conditions</h1>
  <div class="controls">
    <div class="field"><label for="sport">Sport</label><select id="sport"></select></div>
    <div class="field"><label for="spot">Location</label><select id="spot"></select></div>
    <div class="field"><label for="level">Skill level</label><select id="level"></select></div>
    <button id="refresh" type="button">Refresh</button>
  </div>
  <p id="context" class="context"></p>
  <p id="updated" class="muted" aria-live="polite"></p>
  <div id="banner" role="status" aria-live="polite" hidden></div>
  <noscript><p class="banner error">This page needs JavaScript. Check official advisories at weather.gov.sg.</p></noscript>
  <section id="alert" hidden></section>
  <section id="guidance" class="card"></section>
  <details id="details" class="card" hidden>
    <summary>Weather details, observed now</summary>
    <div id="wind" class="block"></div>
    <div id="lightning" class="block"></div>
  </details>
  <section id="interest" class="card"></section>
  <section id="about" class="card plain"></section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
